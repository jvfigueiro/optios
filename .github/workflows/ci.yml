name: OptiOS Verification CI

on:
  push:
    branches:
      - master
      - "pre-public-*"
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: License, Host Tests, Release Build & Headless QEMU
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install host system dependencies (QEMU, OVMF, xorriso, Python 3)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 \
            ovmf \
            xorriso \
            python3 \
            git \
            ca-certificates

      - name: Install Rust toolchain (from rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@4be9baa0d06eb9dca9ef67ba0ebff6f6d6fa6262 # master (pinned SHA)
        with:
          toolchain: stable
          targets: x86_64-unknown-none,x86_64-unknown-linux-gnu
          components: rust-src,llvm-tools-preview

      - name: Step 1 — Run SPDX license & static asset check
        run: ./scripts/license-check.sh

      - name: Step 2 — Run host unit test suite (libs/*)
        run: ./scripts/test.sh

      - name: Step 3 — Build kernel, Ring 3 userland, and UEFI ISO (release)
        run: ./scripts/build.sh release

      - name: Step 4 — Run headless QEMU/OVMF verification gate
        run: ./scripts/run.sh --test

      - name: Upload QEMU serial log and screenshots artifact
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: optios-qemu-verification-logs
          path: |
            build/serial.log
            build/*.png
          if-no-files-found: warn
          retention-days: 14