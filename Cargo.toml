[workspace]
members = [
    "kernel",
    "libs/ustar",
    "libs/ahci-proto",
    "libs/partition-table",
    "libs/elf-loader",
    "libs/ansi-parser",
    "libs/opti-wm",
    "libs/fat32",
    "libs/opti-libc",
    "userland/sysinfo",
    "userland/cat",
    "userland/optifetch",
    "userland/edit",
]
resolver = "2"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = 3
lto = true
codegen-units = 1

