[build]
target = "x86_64-unknown-none"

[target.x86_64-unknown-none]
rustflags = [
    "-C", "code-model=kernel",
    "-C", "relocation-model=static",
    "-C", "no-redzone=y",
    "-C", "target-feature=-mmx,-sse,-sse2,+soft-float",
    "-C", "link-arg=-Tkernel/linker.ld",
    "-C", "link-arg=-nostdlib",
    "-C", "link-arg=-static",
    "-C", "link-arg=-z",
    "-C", "link-arg=max-page-size=0x1000",
]
